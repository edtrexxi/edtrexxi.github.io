<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-description {
            margin-bottom: 25px;
            line-height: 1.5;
            font-size: 1.1rem;
        }
        
        .game-area {
            margin: 25px 0;
        }
        
        .input-group {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        input {
            padding: 12px 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px 0 0 10px;
            width: 70%;
            outline: none;
        }
        
        button {
            padding: 12px 20px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #e91e63;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 20px;
            min-height: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .attempts {
            margin-top: 15px;
            font-size: 1.1rem;
        }
        
        .new-game {
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            width: 100%;
            background-color: #4CAF50;
        }
        
        .new-game:hover {
            background-color: #45a049;
        }
        
        .hint {
            margin-top: 15px;
            font-style: italic;
            color: #e0e0e0;
        }
        
        .history {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .history-title {
            margin-bottom: 10px;
            text-align: center;
        }
        
        .history-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 0.5s ease;
        }
        
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            input, button {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Угадай число</h1>
        
        <p class="game-description">
            Я загадал число от 1 до 100. Попробуй угадать его за минимальное количество попыток!
        </p>
        
        <div class="game-area">
            <div class="input-group">
                <input type="number" id="guessInput" placeholder="Введите число от 1 до 100" min="1" max="100">
                <button id="guessButton">Угадать!</button>
            </div>
            
            <div class="result" id="result">
                Введите число и нажмите "Угадать!"
            </div>
            
            <div class="attempts" id="attempts">
                Попыток: 0
            </div>
            
            <p class="hint" id="hint">
                Подсказка: число находится между 1 и 100
            </p>
            
            <div class="history">
                <div class="history-title">История попыток:</div>
                <div id="historyList"></div>
            </div>
            
            <button class="new-game" id="newGameButton">Новая игра</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Элементы DOM
            const guessInput = document.getElementById('guessInput');
            const guessButton = document.getElementById('guessButton');
            const resultDiv = document.getElementById('result');
            const attemptsDiv = document.getElementById('attempts');
            const hintDiv = document.getElementById('hint');
            const newGameButton = document.getElementById('newGameButton');
            const historyList = document.getElementById('historyList');
            
            // Игровые переменные
            let targetNumber;
            let attempts;
            let gameOver;
            let minRange = 1;
            let maxRange = 100;
            
            // Начало новой игры
            function startNewGame() {
                targetNumber = Math.floor(Math.random() * 100) + 1;
                attempts = 0;
                gameOver = false;
                minRange = 1;
                maxRange = 100;
                
                guessInput.value = '';
                guessInput.disabled = false;
                guessButton.disabled = false;
                resultDiv.textContent = 'Введите число и нажмите "Угадать!"';
                resultDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                attemptsDiv.textContent = 'Попыток: 0';
                hintDiv.textContent = `Подсказка: число находится между ${minRange} и ${maxRange}`;
                historyList.innerHTML = '';
                
                guessInput.focus();
            }
            
            // Обработка попытки угадать
            function makeGuess() {
                if (gameOver) return;
                
                const userGuess = parseInt(guessInput.value);
                
                // Проверка ввода
                if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                    resultDiv.textContent = 'Пожалуйста, введите число от 1 до 100!';
                    resultDiv.style.backgroundColor = 'rgba(255, 193, 7, 0.3)';
                    guessInput.value = '';
                    guessInput.focus();
                    return;
                }
                
                attempts++;
                attemptsDiv.textContent = `Попыток: ${attempts}`;
                
                // Добавление в историю
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = `Попытка ${attempts}: ${userGuess}`;
                historyList.appendChild(historyItem);
                historyList.scrollTop = historyList.scrollHeight;
                
                // Проверка числа
                if (userGuess === targetNumber) {
                    // Победа
                    resultDiv.textContent = `Поздравляем! Вы угадали число ${targetNumber} за ${attempts} попыток!`;
                    resultDiv.style.backgroundColor = 'rgba(76, 175, 80, 0.5)';
                    gameOver = true;
                    guessInput.disabled = true;
                    guessButton.disabled = true;
                    hintDiv.textContent = 'Отличная игра! Начните новую, если хотите сыграть ещё.';
                } else {
                    // Не угадали
                    resultDiv.classList.add('pulse');
                    setTimeout(() => resultDiv.classList.remove('pulse'), 500);
                    
                    if (userGuess < targetNumber) {
                        resultDiv.textContent = 'Загаданное число больше!';
                        minRange = Math.max(minRange, userGuess + 1);
                    } else {
                        resultDiv.textContent = 'Загаданное число меньше!';
                        maxRange = Math.min(maxRange, userGuess - 1);
                    }
                    
                    resultDiv.style.backgroundColor = 'rgba(244, 67, 54, 0.3)';
                    hintDiv.textContent = `Подсказка: число находится между ${minRange} и ${maxRange}`;
                    
                    // Очистка поля ввода и фокус
                    guessInput.value = '';
                    guessInput.focus();
                }
            }
            
            // Обработчики событий
            guessButton.addEventListener('click', makeGuess);
            
            guessInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    makeGuess();
                }
            });
            
            newGameButton.addEventListener('click', startNewGame);
            
            // Начало игры при загрузке
            startNewGame();
        });
    </script>
</body>
</html>
