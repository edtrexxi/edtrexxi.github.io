<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Ball</title>
    <script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js">
    </script>
    <style>
        #canvas {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
            background: #f8f9fa;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div id="canvas"></div>
    <script>
        var paper = Raphael("canvas", 400, 400);

        var ball = paper.circle(50, 50, 20);
        ball.attr({ 
            fill: "#4facfe",  // Изменен цвет на приятный синий
            stroke: "#2c3e50",
            "stroke-width": 2
        });

        // Анимируем изменение атрибутов cx, cy и r
        ball.animate({ cx: 350, cy: 350, r: 40 }, 2000, "ease-in-out");
        
        ball.node.onclick = () => {
            console.log('Ball clicked!');
        }
    </script>
</body>

</html>
